<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARBEL Admin Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <h1>MARBEL</h1>
        <p>Admin Login</p>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <div class="error-message" id="email-error"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <div class="error-message" id="password-error"></div>
            </div>

            <div class="form-group">
                <button type="submit" id="login-btn">Login</button>
                <div class="loading" id="loading">Loading...</div>
            </div>

            <div class="error-message" id="general-error"></div>
        </form>

        <!-- Demo credentials for testing -->
        <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: #999;">
            Demo Credentials:<br>
            Email: admin@marbel.com<br>
            Password: Admin@123
        </p>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            const loading = document.getElementById('loading');

            // Clear previous errors
            document.getElementById('general-error').classList.remove('show');
            document.getElementById('general-error').textContent = '';

            // Show loading state
            loginBtn.disabled = true;
            loading.style.display = 'block';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    throw new Error('Invalid email or password');
                }

                const data = await response.json();

                // Store token and user info
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('currentUser', JSON.stringify({
                    id: data.userId,
                    email: data.email,
                    fullName: data.fullName,
                    role: data.role
                }));

                // Redirect to dashboard
                window.location.href = 'dashboard.html';

            } catch (error) {
                const errorElement = document.getElementById('general-error');
                errorElement.textContent = error.message || 'Login failed. Please try again.';
                errorElement.classList.add('show');

                loginBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        // Check if already logged in
        if (localStorage.getItem('authToken')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
