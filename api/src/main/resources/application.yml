spring:
  application:
    name: marbel-api
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: false
  datasource:
    url: jdbc:mysql://localhost:3306/marbel_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  sql:
    init:
      mode: always

jwt:
  secret: marbel-super-secret-key-change-this-in-production-must-be-at-least-32-chars!!
  expiration: 86400000  # 24 hours in milliseconds

aws:
  s3:
    bucket-name: marbel-products-images
    region: us-east-1
  accessKey: YOUR_AWS_ACCESS_KEY
  secretKey: YOUR_AWS_SECRET_KEY

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    root: INFO
    com.marbel: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
